<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script src="./node_modules/jquery/dist/jquery.min.js"></script>
<body>
    <h1>JQUERY - JAVA SCRIPT LIBRARY</h1>
<p id="para">Hello everyone today is wednesday</p>
<button id="addpara">Add para</button>
<ul id="list" style="list-style:none;">
    <li>Hello</li>
</ul>
<button id="addlist">Add list</button>
<div style="background-color: rgb(142, 42, 165);" id="test"></div>
<button id="animate">Animate</button>
</body>
<script>
    $(function(){
$("#animate").click(function(){
$("#test").animate({
    width:'400px',
    height:'300px',
    opacity:0.8,
    left:'100px',

},2000)
})
    })
    $(function(){
        $("#addpara").click(function(){
        $("#para").append ("<br>Have a nice day")
        })
        $("#addlist").click(function(){
            $("#list").append("<li>Have a nice day</li>")
        })

    })
</script>
</html>
